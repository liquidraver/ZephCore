description: |
  Semtech LR2021 LoRa Plus transceiver (4th-gen LoRa IP).
  Uses native Semtech lr20xx_driver SDK with Zephyr LoRa driver API.
  Supports sub-GHz + 2.4 GHz ISM + NTN/SATCOM.

compatible: "semtech,lr2021"

include: spi-device.yaml

properties:
  reset-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to NRESET (active-low).

  busy-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to BUSY (high = busy).

  irq-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to DIO5/IRQ line (active-high, pull-down).

  tcxo-voltage:
    type: int
    default: 0
    description: |
      TCXO supply voltage in millivolts. On LR2021 the TCXO sits on XTA and is
      fed by the internal regulator via the VTCXO pin (datasheet S1.9.3) — not
      DIO3, despite what the SX126x-derived names elsewhere suggest.
      0 = no TCXO (use XTAL). Allowed: 1600, 1700, 1800, 2200, 2400, 2700,
      3000, 3300.

  tcxo-power-startup-delay-ms:
    type: int
    default: 10
    description: |
      Deadline for the 32 MHz TCXO to start and stabilise, in milliseconds.
      This is a timeout, not a fixed wait, so erring high only delays how
      quickly a dead oscillator is reported. Too low and the chip raises
      HF_XOSC_START_ERR and rejects every later command.

  rx-boosted:
    type: boolean
    description: Enable RX boosted mode for better sensitivity (+~3dB, +~2mA).

  irq-dio:
    type: int
    default: 9
    description: |
      Chip-side DIO wired to the MCU interrupt line, 5..11. This is the DIO
      number on the LR2021 itself, not the SoC pin — the SoC side is irq-gpios.

  rfsw-enable:
    type: int
    default: 0
    description: |
      RF switch DIO enable bitmask (bit 0 = DIO5, bit 1 = DIO6, ... bit 6 =
      DIO11). DIO5..DIO11 is the chip's entire RF-switch-capable range, so
      bit 7 is unused. Set a bit to include that DIO in RF switch control.
      The DIO named by irq-dio is skipped even if its bit is set here.

  rfsw-standby:
    type: int
    default: 0
    description: |
      Bitmask of RF switch DIOs that are HIGH in standby mode.
      Bit mapping matches rfsw-enable.

  rfsw-rx:
    type: int
    default: 0
    description: |
      Bitmask of RF switch DIOs that are HIGH in RX mode, in BOTH bands.
      Bit mapping matches rfsw-enable. This is the convenient form for
      the common single-band board; set rfsw-rx-lf / rfsw-rx-hf
      instead when the two bands need different masks.

  rfsw-rx-lf:
    type: int
    description: |
      Bitmask of RF switch DIOs that are HIGH in sub-GHz RX only.
      Defaults to rfsw-rx when omitted. Bit mapping matches
      rfsw-enable.

  rfsw-rx-hf:
    type: int
    description: |
      Bitmask of RF switch DIOs that are HIGH in 2.4 GHz RX only.
      Defaults to rfsw-rx when omitted. Bit mapping matches
      rfsw-enable.

      Split from rfsw-rx for front ends whose two bands are mutually
      exclusive: the Meshnology W12 must hold the GC1109 sub-GHz FEM in
      shutdown (DIO11 low) during 2.4 GHz RX, which a single shared mask
      cannot express. Do NOT give these two a `default:` here — the driver
      falls back to rfsw-rx by testing for the property's absence.

  rfsw-tx:
    type: int
    default: 0
    description: |
      Bitmask of RF switch DIOs that are HIGH in sub-GHz TX mode (LF PA).
      Bit mapping matches rfsw-enable.

  rfsw-tx-hp:
    type: int
    default: 0
    description: |
      Bitmask of RF switch DIOs that are HIGH in 2.4 GHz / high-power TX mode (HF PA).
      Bit mapping matches rfsw-enable.
