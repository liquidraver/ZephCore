description: |
  Semtech LR1110 LoRa transceiver, ZephCore driver (drivers/lora/lr11xx).
  Property names follow upstream's semtech,lr11xx-base.yaml, so a board file
  carries over unchanged if the driver is ever swapped for upstream's.
  Base properties this driver does not implement are blocked, so setting one
  is a build error instead of a silent no-op. pa-hp-sel and pa-duty-cycle are
  ZephCore additions.

compatible: "semtech,lr1110"

include:
  - name: semtech,lr11xx-base.yaml
    property-blocklist:
      - lf-clk
      - use-dcdc
      - force-ldro
      - rfsw-tx-hf
      - rfsw-wifi

properties:
  reset-gpios:
    required: true

  busy-gpios:
    required: true

  irq-gpios:
    required: true

  pa-hp-sel:
    type: int
    default: 7
    description: PA HP selection (0-7). 7 = max power for HP PA.

  pa-duty-cycle:
    type: int
    default: 4
    description: PA duty cycle (0-7). Controls PA output power curve.
