# LR2021 LoRa Plus EVK (XIAO nRF54LM20A) bring-up logging.
#
#   west build -b seeed_lr2021_evk_lm20a/nrf54lm20a/cpuapp zephcore --pristine --no-sysbuild -- \
#     -DEXTRA_CONF_FILE="boards/common/debug.conf;boards/nrf54l/seeed_lr2021_evk_lm20a/bringup.conf"
#
# Same set, for the same reasons, as boards/nrf54l/seeed_lr2021_evk/bringup.conf.
# Not for daily use.

CONFIG_LORA_LOG_LEVEL_DBG=y

CONFIG_I2C_LOG_LEVEL_INF=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y

# One line per real input event: K1 reaches the XIAO through a pogo pin, and
# whether it lands on this XIAO's D14 pad is a bench question.
CONFIG_INPUT_LOG_LEVEL_INF=y
CONFIG_INPUT_EVENT_DUMP=y

CONFIG_FS_LOG_LEVEL_DBG=y
