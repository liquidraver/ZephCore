# Semtech LR2021 LoRa Plus EVK (XIAO nRF54LM20A + Wio-LR2021)
# Board-specific configuration

# Board identification
CONFIG_ZEPHCORE_BOARD_NAME="LR2021 LoRa Plus EVK LM20A"

# Device Information Service model name
CONFIG_BT_DIS_MODEL_NUMBER_STR="Seeed LR2021 LoRa Plus EVK LM20A"

# LR2021 radio driver
CONFIG_ZEPHCORE_RADIO_LR2021=y

# 511 KB of RAM leaves room well past the defaults (350 / 256). 510 contacts is
# the most the companion protocol can report to the app (one byte, doubled);
# each contact costs 188 B of RAM and each queue slot 173 B.
CONFIG_ZEPHCORE_MAX_CONTACTS=510
CONFIG_ZEPHCORE_OFFLINE_QUEUE_SIZE=512

# /ext on the XIAO's SPI NOR: LittleFS takes its block size from the flash page
# layout, and the SPI NOR driver's default page is the 64 KB block, not the
# 4 KB sector (the QSPI driver's equivalent is set in nrf52_common.conf).
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
