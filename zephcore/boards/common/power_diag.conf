# TEMPORARY bench instrumentation: `get pwr <n>` (helpers/power_diag.c) and
# `get loop.wakes`.  nRF52840 only.  Logging stays off, as in a release build,
# so the log thread adds no wakes of its own.
CONFIG_ZEPHCORE_POWER_DIAG=y
CONFIG_ZEPHCORE_LOOP_WAKE_STATS=y

# The idle and ISR-entry hooks power_diag counts from.
CONFIG_TRACING=y
CONFIG_TRACING_USER=y

# Per-thread run time.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
