# WiFi companion: the app reaches the node over TCP on the saved network
# (set wifi.ssid / wifi.pwd, reboot), beside BLE and USB.
#
# Added by CMake to companion builds of boards whose zephcore.yml declares
# `capabilities: wifi: true`; pass it in EXTRA_CONF_FILE to try another board.
# On a PSRAM board the WiFi heap and the network buffers go to PSRAM (see
# ZEPHCORE_COMPANION_WIFI in Kconfig).

CONFIG_ZEPHCORE_COMPANION_WIFI=y

# IPv4 station: DHCP for the address, TCP for the app. No DNS, no SNTP (the
# app sets the clock), no TLS.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# System heap: 72 KB. On a PSRAM board the Kconfig ADD_SIZE sum is only ~55 KB
# (the WiFi heap itself is in PSRAM), and measured 2026-09-24 on a XIAO ESP32-S3
# the companion idles at 50 KB and peaks at 54.1 KB under load (BLE pairing,
# protocol golden over BLE and TCP, bulk dump), before any WiFi traffic burst;
# the WiFi driver's DMA buffers still come from here. Zephyr uses the larger of
# this and the ADD_SIZE sum, so no-PSRAM boards (sum ~81 KB) keep theirs unless
# Kconfig sets HEAP_MEM_POOL_IGNORE_MIN for them (ESP32-S3 without PSRAM).
CONFIG_HEAP_MEM_POOL_SIZE=73728
