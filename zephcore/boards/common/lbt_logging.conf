# Listen-before-talk diagnostic lines on top of packet logging.
# Build: west build -b <board> zephcore --pristine -- \
#   -DEXTRA_CONF_FILE="boards/common/repeater.conf;boards/common/packet_logging.conf;boards/common/lbt_logging.conf"
#
# Adds one line per transmit attempt and per hold-back, for example:
#   LBT t=123456 busy rssi=-97 ref=1 retry=412 len=64 type=5 route=F nf=-112
#   LBT t=123870 clr ref=2 retry=0 len=64 type=5 route=F nf=-112
# mctomqtt ignores these lines; diagpush.py keeps them. Version gets "+lbtlog".

CONFIG_ZEPHCORE_LBT_LOGGING=y
