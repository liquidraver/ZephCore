# ZephCore board manifest — schema in zephcore/scripts/board_manifest.py
target: lilygo_t3s3/esp32s3/procpu
release:
  roles: [companion, repeater]
# Catalog: MeshCore splits this board by radio -- "(SX126x)" and "(SX127x)" are
# two tiles sharing the "LilyGo T3 S3" group. We only build the SX1262 variant, so
# fold into the SX126x tile; an SX127x port would be its own entry.
catalog:
  device: "LilyGo T3 S3 (SX126x)"
  maker: lilygo
