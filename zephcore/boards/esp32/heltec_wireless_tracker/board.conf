# Heltec Wireless Tracker (V1.1) — ESP32-S3-FN8 + SX1262 + ST7735R 160x80 TFT + GPS
#
# Hardware:
#   ESP32-S3-FN8 (8MB embedded flash)
#   SX1262 LoRa on SPI2 (DIO2 as RF switch, external TCXO 1.8V)
#   ST7735R 1.14" 160x80 colour TFT on SPI3 (backlight on GPIO21)
#   GPS (gnss-nmea-generic) on UART2 (TX=GPIO34, RX=GPIO33), 115200 baud
#   GPS run/enable GPIO35 (active HIGH); GPS powered by the Vext rail (GPIO3)
#   Battery ADC: GPIO1 = ADC1 ch0 (&adc0), divider enable GPIO2 (active HIGH)
#   Status LED GPIO18 (led0); user button GPIO0
#
# Include order: prj.conf → zephcore_common.conf → esp32_common.conf → board.conf

# Board identification
CONFIG_ZEPHCORE_BOARD_NAME="Heltec Tracker"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Heltec Wireless Tracker"

# Flash size — ESP32-S3-FN8 = 8 MB
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y

# BLE privacy: inherit CONFIG_BT_PRIVACY=y from esp32_common.conf — do NOT
# override to =n.  On ESP32-S3 the Espressif controller's privacy-OFF
# Secure-Connections path MIC-fails against iOS (HCI disconnect 0x3d at
# encryption start; see findings.md Issue #34).  Android "connect from app" is
# already preserved with privacy ON because start_adv() advertises with
# BT_LE_ADV_OPT_USE_IDENTITY (stable identity address, never an RPA), so there
# is no need to disable privacy for Android.

# Single button, ENTER emitted via a zephyr,input-longpress filter (see
# board.overlay): the default 500ms double-press confirm window (shutdown/
# DFU/offgrid) is too short for two ~1s holds, see Kconfig help text.
CONFIG_ZEPHCORE_UI_CONFIRM_WINDOW_MS=3000

# WiFi + BLE companion without PSRAM (`capabilities: wifi` in zephcore.yml):
# contacts are what gives. 130 is the largest count that links with ~2 KB DRAM
# to spare (188 B per contact; measured 2026-09-24, see
# devdocs/lld/08-connectivity.md §14). The offline queue stays at 256. An
# existing contacts file holding more is truncated to 130 on first load.
CONFIG_ZEPHCORE_MAX_CONTACTS=130
