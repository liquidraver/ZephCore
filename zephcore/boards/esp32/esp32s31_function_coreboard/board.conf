# SPDX-License-Identifier: MIT
# Espressif ESP32-S31-Function-CoreBoard-1 + SX1262 LoRa
#
# Hardware:
# - ESP32-S31-WROOM-3 (RISC-V, 16 MB flash, 16 MB octal PSRAM)
# - SX1262 module on SPI2 via the J2 header: SCK=GPIO20, MOSI=GPIO21,
#   MISO=GPIO22, NSS=GPIO23, BUSY=GPIO24, DIO1=GPIO25, RESET=GPIO38,
#   RXEN=GPIO39 (pin table in board.overlay)
# - Console/CLI on UART0 (GPIO58/59, on-board USB-UART bridge)
# - No BLE controller and no Wi-Fi driver on this SoC yet: repeater only

CONFIG_ZEPHCORE_BOARD_NAME="ESP32-S31 CoreBoard"
CONFIG_BT_DIS_MODEL_NUMBER_STR="ESP32-S31 CoreBoard"
