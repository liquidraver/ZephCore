# Heltec WiFi LoRa 32 V3 — ESP32-S3 + SX1262
#
# Hardware:
#   ESP32-S3 (8MB flash, no PSRAM)
#   SX1262 on SPI2 (direct output, no PA)
#   SSD1306 128x64 OLED on I2C0
#   Optional external GPS on UART1 (RX=GPIO47, TX=GPIO48, enable GPIO26)
#   User button on GPIO0
#
# Include order: prj.conf → zephcore_common.conf → esp32_common.conf → board.conf

# Board identification
CONFIG_ZEPHCORE_BOARD_NAME="Heltec V3"
CONFIG_BT_DIS_MODEL_NUMBER_STR="Heltec WiFi LoRa 32 V3"

# Flash size — 8MB (override esp32_common.conf 4MB default)
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y

# No GPIO power domains on this board — board.overlay deletes the upstream
# vext_ctrl / adc_ctrl power-domain-gpio nodes and drives both rails with
# regulator-fixed instead (see the comments there).
#
# This has to be said explicitly because the upstream board Kconfig.defconfig
# (zephyr/boards/heltec/heltec_wifi_lora32_v3/Kconfig.defconfig) sets
# "config POWER_DOMAIN_GPIO / default y" WITHOUT the driver's own
# "depends on DT_HAS_POWER_DOMAIN_GPIO_ENABLED" guard. So with the DT nodes
# deleted the symbol still defaults y, while the driver's "select DEVICE_DEPS"
# — which lives in the guarded definition — does not fire. The driver then
# compiles with no instances, and once CONFIG_PM_DEVICE=y made its
# CONFIG_PM_DEVICE_POWER_DOMAIN block live it called device_supported_foreach(),
# which only exists under CONFIG_DEVICE_DEPS: implicit-declaration build error.
#
# Turning the subsystem off is the accurate fix — we genuinely have no power
# domains — and it avoids paying for DEVICE_DEPS just to compile a driver that
# would have zero instances. V4/V43 use ZephCore-local board definitions with
# no such defconfig and are unaffected.
#
# POWER_DOMAIN=n is the whole fix: drivers/CMakeLists.txt only descends into
# power_domain/ under it, so the .c never reaches the compiler. Note that
# CONFIG_POWER_DOMAIN_GPIO stays =y in the resulting .config — the board
# defconfig's default is outside the driver's "if POWER_DOMAIN" block, so it
# survives. Do NOT try to pin it =n here: the symbol is not assignable with the
# parent off, and Kconfig answers with a warning while keeping y. It is inert.
CONFIG_POWER_DOMAIN=n
