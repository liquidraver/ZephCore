# ZephCore board manifest — schema in zephcore/scripts/board_manifest.py
target: heltec_wifi_lora32_v4_r8/esp32s3/procpu
# No light_sleep capability on purpose: the wiring qualifies (DIO1=GPIO14,
# NSS=GPIO8, RESET=GPIO12, button on gpio0) but CONFIG_PM was never validated on
# this board. Declare it once pm_esp32.conf's three checks pass on hardware.
release:
  roles: [companion, repeater]
# Catalog: MeshCore folds the R8 (ESP32-S3R8, 8 MB octal PSRAM) into its
# "Heltec v4" tile as "[R8] ..." role rows rather than a device of its own, so it
# folds here too, told apart by the subtitle.
catalog:
  device: "Heltec v4"
  maker: heltec
  subtitle: R8
