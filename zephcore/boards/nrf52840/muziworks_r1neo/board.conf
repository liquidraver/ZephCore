# muzi works R1 Neo (nRF52840 + SX1262)
# SPDX-License-Identifier: MIT
#
# RAK4630 stamp module on a custom muzi baseboard. Flash layout matches
# RAK4631 (SoftDevice s140 v6.1.1, app @ 0x26000), so the stock UF2
# bootloader is reused — no re-flash needed.
#
# The baseboard is a soft-power design: a dedicated I/O controller gates the
# DCDC rail and only keeps it up while the MCU holds P0.13 asserted. That is
# handled entirely in devicetree — gpio-hog to latch on at boot, and a
# zephcore,poweroff-gpios node to release at shutdown.
#
# Most features are auto-detected from devicetree:
#   - PWM + buzzer            (buzzer nodelabel)      -> UI_BUZZER
#   - user button + LEDs      (gpio-keys / gpio-leds) -> UI_BUTTONS
#   - LoRa RX duty cycle      (companion + SX1262)
#   - GNSS, battery ADC, RX8130CE RTC
#
# There is no display on this board, so ZEPHCORE_UI_DISPLAY stays off and the
# UI reduces to the button actions listed in the DTS.

# Board identification (matches Arduino MeshCore variant name)
CONFIG_ZEPHCORE_BOARD_NAME="muzi works R1 Neo"

# Device Information Service model name
CONFIG_BT_DIS_MODEL_NUMBER_STR="muzi works R1 Neo"

# SoftDevice firmware ID (s140 v6.1.1 — same as RAK4631)
CONFIG_ZEPHCORE_SD_FWID=0x00B6
