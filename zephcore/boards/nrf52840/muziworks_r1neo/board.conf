# muzi works R1 Neo board configuration

# Board identification (matches Arduino variant name)
CONFIG_ZEPHCORE_BOARD_NAME="muzi works R1 Neo"

# Device Information Service model name
CONFIG_BT_DIS_MODEL_NUMBER_STR="muzi works R1 Neo"

# SoftDevice firmware ID (R1 Neo bootloader uses S140 v6)
CONFIG_ZEPHCORE_SD_FWID=0x00B6
