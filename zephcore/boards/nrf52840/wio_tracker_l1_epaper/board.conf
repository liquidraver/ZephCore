# Seeed Wio Tracker L1 (nRF52840 + SX1262 + SSD1680 ePaper)
# Board-specific configuration

CONFIG_ZEPHCORE_BOARD_NAME="Wio Tracker L1 EPD"

# Device Information Service model name
CONFIG_BT_DIS_MODEL_NUMBER_STR="Wio Tracker L1 EPD"

# SoftDevice firmware ID (S140 v6.1.1)
CONFIG_ZEPHCORE_SD_FWID=0x00B6

# Enable SPI & display drivers
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_SSD16XX=y

# SSD1680 296x128 CFB framebuffer needs 4736 bytes from k_malloc.
# Default heap (2048) is sized for SSD1306 128x64 (1024 bytes).
CONFIG_HEAP_MEM_POOL_SIZE=6144

# Shrink RTT buffer to free RAM (4096 -> 1024)
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024
