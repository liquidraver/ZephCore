name: host tests

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'releasenotes/**', 'img/**']
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'releasenotes/**', 'img/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # The runner image ships Python 3.12, CMake, Ninja and GCC.
      - run: python3 tests/run.py run --sanitize
